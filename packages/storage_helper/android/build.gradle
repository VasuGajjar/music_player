group 'com.vasugajjar.storage_helper'
version '1.0-SNAPSHOT'

buildscript {
    ext.kotlin_version = '2.2.20'
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:8.11.1'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
        // NewPipeExtractor is only published on JitPack.
        maven { url 'https://jitpack.io' }
    }
}

apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

android {
    namespace 'com.vasugajjar.storage_helper'
    compileSdk 36

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        minSdk 24
        consumerProguardFiles 'proguard-rules.pro'
    }
}

dependencies {
    // Same commit NewPipe's dev branch pins (gradle/libs.versions.toml): v0.26.5 still relies on
    // ANDROID/IOS clients that need poTokens; dev streams through VISIONOS instead.
    implementation 'com.github.TeamNewPipe:NewPipeExtractor:3313901108f0f52df68c28a04d88c2891f9c400b'
    // Required by the extractor below minSdk 33.
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs_nio:2.1.5'
}
